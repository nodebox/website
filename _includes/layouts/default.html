---
layout: base
---
{% if title %}<div class="page-heading"><h1>{{ title }}</h1></div>{% endif %}
<div class="page-layout{% if images %} has-aside{% endif %}">
  <div class="page-body">{{ content }}</div>
  {% if images %}
  <aside class="page-gallery">
    {% for image in images %}
      {% assign image_parts = image | size %}
      {% if image_parts == 2 %}
        <figure><a class="thumb" rel="images" href="/media/{{ image[0] }}" title="{{ image[1] }}"><img src="/media/{{ image[0] }}" alt="{{ image[1] }}"></a><figcaption>{{ image[1] }}</figcaption></figure>
      {% else %}
        <a class="thumb" rel="images" href="/media/{{ image }}"><img src="/media/{{ image }}" alt="{{ title }}"></a>
      {% endif %}
    {% endfor %}
  </aside>
  {% endif %}
</div>
