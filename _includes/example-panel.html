<figure class="example" id="example-{{ ex.id }}" data-kind="{{ ex.kind }}" data-src="{{ ex.src }}"{% if hidden %} hidden{% endif %}{% if tabbed %} role="tabpanel" aria-labelledby="tab-{{ ex.id }}{{ suffix }}"{% endif %}>
  <div class="artwork-stage"><img src="{{ ex.still }}" alt="{{ ex.alt }}" width="800" height="700"{% if hidden %} loading="lazy"{% endif %}></div>
  <figcaption class="artwork-controls"><button class="example-play" type="button" aria-label="Play animation" data-playing="false" disabled><svg class="icon-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor"/></svg><svg class="icon-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 2l11 6-11 6z" fill="currentColor"/></svg></button><label for="{{ ex.id }}-control{{ suffix }}">{{ ex.label }}</label><input id="{{ ex.id }}-control{{ suffix }}" type="range" min="{{ ex.min }}" max="{{ ex.max }}" step="any" data-digits="{{ ex.digits }}" value="{{ ex.value }}" data-unit="{{ ex.unit }}" disabled><output aria-live="off" for="{{ ex.id }}-control{{ suffix }}">{{ ex.value }}{{ ex.unit }}</output><a href="{{ ex.download }}" download>Download this example</a>{% if ex.data %}<a href="{{ ex.data }}" download>Data</a>{% endif %}</figcaption>
  {% if caption %}<p class="example-note">{{ ex.description }}</p>{% endif %}
</figure>
